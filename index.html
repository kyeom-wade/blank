<title>Blank — AR Glasses · 2040</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
/* Blank — Cold-blue AR glassmorphism system */
:root {
  --bg-0: #04060a;
  --bg-1: #070b13;
  --bg-2: #0a121f;
  --ink-0: #0f1923;
  --ink-1: #1e3348;
  --ink-2: #4a6278;
  --ink-3: #7a95aa;
  --ink-4: #b0c8d8;

  --cyan: oklch(0.48 0.15 218);
  --cyan-dim: oklch(0.40 0.12 218);
  --cyan-deep: oklch(0.32 0.10 220);
  --coral: oklch(0.52 0.17 28);
  --mint: oklch(0.48 0.13 170);
  --violet: oklch(0.50 0.12 285);

  --hair: rgba(190, 220, 255, 0.10);
  --hair-strong: rgba(190, 220, 255, 0.22);
  --glass: rgba(150, 190, 230, 0.04);
  --glass-2: rgba(150, 190, 230, 0.07);

  --font-sans: "Inter", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg-0);
  color: var(--ink-0);
  font-family: var(--font-sans);
  font-feature-settings: "ss01", "cv11";
  overflow: hidden;
  letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
}

#root { width: 100%; height: 100vh; position: relative; }

/* ───────────── World layer ───────────── */
.world {
  position: absolute; inset: 0;
  background: #04060a;
}
.world-photo {
  position: absolute; inset: 0;
  overflow: hidden;
}
.world-photo video {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 37% 35%;
}

.floor {
  position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
  background:
    linear-gradient(180deg, transparent 0%, rgba(20, 35, 60, 0.35) 60%, rgba(10, 18, 32, 0.9) 100%);
  border-top: 1px solid rgba(120, 170, 220, 0.06);
}

/* ───────────── Subject ───────────── */
.subject {
  position: absolute;
  left: 50%; top: 44%;
  transform: translate(-50%, -50%);
  width: 320px; height: 440px;
  display: flex; flex-direction: column; align-items: center;
}
.subject-figure { display: none; }

/* ───────────── Glass primitives ───────────── */
.glass {
  background:
    linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.10) 100%),
    rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(24px) saturate(1.6);
  -webkit-backdrop-filter: blur(24px) saturate(1.6);
  border: 1px solid rgba(255, 255, 255, 0.30);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
  border-radius: 22px;
  position: relative;
}
.glass::before {
  content: ""; position: absolute; inset: 0;
  border-radius: inherit;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,255,255,0.18), transparent 60%);
  pointer-events: none;
}
.glass-strong {
  background:
    linear-gradient(180deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.12) 100%),
    rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.38);
}

/* corner ticks */
.ticks {
  position: absolute; inset: 0; pointer-events: none;
}
.ticks::before, .ticks::after,
.ticks > i:nth-child(1)::before, .ticks > i:nth-child(1)::after {
  content: ""; position: absolute;
  width: 8px; height: 8px;
  border: 1px solid var(--cyan-dim);
  opacity: 0.55;
}
.ticks::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.ticks::after { top: -1px; right: -1px; border-left: none; border-bottom: none; }
.ticks > i { position: absolute; inset: 0; }
.ticks > i:nth-child(1)::before { bottom: -1px; left: -1px; border-right: none; border-top: none; top: auto; }
.ticks > i:nth-child(1)::after { bottom: -1px; right: -1px; border-left: none; border-top: none; top: auto; }

/* ───────────── Type utilities ───────────── */
.mono { font-family: var(--font-mono); white-space: nowrap; }
.upper { text-transform: uppercase; letter-spacing: 0.16em; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--ink-2);
  white-space: nowrap;
}
.label {
  font-family: var(--font-mono);
  font-size: 9px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--ink-3);
  white-space: nowrap;
}
.value-lg {
  font-family: var(--font-mono);
  font-size: 28px; font-weight: 300; letter-spacing: -0.01em;
  color: var(--ink-0);
}
.value-md {
  font-family: var(--font-mono);
  font-size: 16px; font-weight: 400; letter-spacing: 0;
  color: var(--ink-0);
}

/* ───────────── HUD frames ───────────── */
.lens-frame {
  position: absolute; inset: 18px;
  border-radius: 24px;
  border: 1px solid rgba(120, 170, 220, 0.06);
  pointer-events: none;
}
.lens-frame::before {
  content: ""; position: absolute; inset: -1px;
  border-radius: inherit;
  box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.6);
  pointer-events: none;
}

/* top status bar */
.status-bar {
  position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 14px;
  padding: 10px 18px;
  border-radius: 100px;
  z-index: 20;
  white-space: nowrap;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); }
.dot.dim { background: var(--ink-3); box-shadow: none; }

/* subject id card */
.subject-id-card {
  position: absolute;
  left: 37%;
  top: 18%;
  transform: translateX(-50%);
  padding: 10px 16px 10px 14px;
  z-index: 12;
  border-radius: 100px;
  animation: fadeUp 700ms ease both;
}

/* gaze reticle */
.reticle {
  position: absolute; left: 37%; top: 46%;
  transform: translate(-50%, -50%);
  width: 320px; height: 320px;
  pointer-events: none; z-index: 5;
  opacity: 0.6;
}

/* ───────────── Telemetry panels ───────────── */
.panel { padding: 18px 20px; min-width: 240px; border-radius: 22px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.panel-row { display: flex; align-items: baseline; gap: 12px; }

/* heart ECG */
.ecg-track {
  height: 56px;
  background:
    repeating-linear-gradient(to right, rgba(120, 170, 220, 0.05) 0 1px, transparent 1px 12px),
    repeating-linear-gradient(to bottom, rgba(120, 170, 220, 0.05) 0 1px, transparent 1px 12px);
  border-radius: 6px;
  position: relative; overflow: hidden;
}
.ecg-line {
  stroke: var(--cyan);
  fill: none; stroke-width: 1.4;
}

/* voice waveform */
.wave {
  display: flex; align-items: center; gap: 2px; height: 56px;
}
.wave i {
  flex: 1; background: var(--cyan); border-radius: 2px;
  animation: wave 1.4s ease-in-out infinite;
  opacity: 0.85;
}
@keyframes wave {
  0%, 100% { transform: scaleY(0.25); }
  50% { transform: scaleY(1); }
}

/* truth meter */
.meter {
  position: relative; height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 100px; overflow: hidden;
}
.meter-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));
  border-radius: 100px;
}
.meter-fill.warn { background: linear-gradient(90deg, var(--coral), oklch(0.52 0.17 50)); }

/* tag chips */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 100px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.10);
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-1);
  white-space: nowrap;
  backdrop-filter: blur(20px);
}
.chip.cyan { color: var(--cyan); border-color: rgba(140, 200, 240, 0.3); }
.chip.coral { color: var(--coral); border-color: rgba(240, 160, 130, 0.28); }
.chip.mint { color: var(--mint); border-color: rgba(130, 210, 190, 0.28); }

/* transcript */
.transcript {
  font-size: 13px; line-height: 1.7;
  color: var(--ink-1); letter-spacing: -0.005em;
}
.t-truth { color: var(--mint); }
.t-flag { color: var(--coral); position: relative; }
.t-flag::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -2px;
  border-bottom: 1px dashed var(--coral); opacity: 0.6;
}

/* ───────────── Action buttons ───────────── */
.btn {
  font-family: var(--font-sans);
  font-size: 14px; font-weight: 500;
  padding: 13px 24px;
  white-space: nowrap;
  background: rgba(255,255,255,0.20);
  color: var(--ink-0);
  border: 1px solid rgba(255,255,255,0.38);
  border-radius: 100px;
  cursor: pointer;
  letter-spacing: 0.01em;
  backdrop-filter: blur(24px) saturate(1.6);
  -webkit-backdrop-filter: blur(24px) saturate(1.6);
  transition: all 200ms ease;
  display: inline-flex; align-items: center; gap: 10px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.45);
}
.btn:hover {
  background: rgba(255,255,255,0.32);
  border-color: rgba(255,255,255,0.52);
}
.btn-primary {
  background: linear-gradient(180deg, rgba(60, 130, 220, 0.82), rgba(30, 90, 180, 0.78));
  color: #fff;
  border: 1px solid rgba(120, 180, 255, 0.35);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
}
.btn-primary:hover {
  background: linear-gradient(180deg, rgba(70, 145, 235, 0.90), rgba(40, 105, 200, 0.86));
}
.btn-ghost {
  background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08);
  color: var(--ink-1);
}

.actions {
  position: absolute; left: 50%; bottom: 60px;
  transform: translateX(-50%);
  display: flex; gap: 12px; z-index: 30;
}

/* ───────────── Animations ───────────── */
@keyframes sweepRight {
  0%   { transform: translateX(-100%); opacity: 0; }
  20%  { opacity: 1; }
  100% { transform: translateX(100%);  opacity: 0; }
}
.swipe-sweep {
  position: fixed; inset: 0;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(100,180,255,0.10) 35%,
    rgba(140,200,255,0.22) 50%,
    rgba(100,180,255,0.10) 65%,
    transparent 100%);
  animation: sweepRight 420ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
  pointer-events: none;
  z-index: 200;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeDown {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(-12px); }
}
@keyframes pulse-ring {
  0% { transform: scale(0.9); opacity: 0.6; }
  100% { transform: scale(1.6); opacity: 0; }
}
@keyframes blink { 50% { opacity: 0.3; } }
@keyframes drift {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-3px, 2px); }
}
@keyframes scan {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(100%); }
}

.fade-in { animation: fadeUp 600ms ease both; }
.fade-out { animation: fadeDown 400ms ease both; }
.blink { animation: blink 1.6s ease-in-out infinite; }
.drift { animation: drift 7s ease-in-out infinite; }

.panel-pos {
  position: absolute;
  z-index: 10;
  animation: fadeUp 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.connector {
  position: absolute;
  pointer-events: none;
  opacity: 0.35;
}

/* ───────────── Ceremony overlay ───────────── */
.ceremony-bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(20, 50, 90, 0.5), rgba(0,0,0,0.85));
  backdrop-filter: blur(8px);
  z-index: 50;
  display: flex; align-items: center; justify-content: center;
  animation: fadeUp 600ms ease both;
}
.ceremony-card {
  width: 760px; padding: 48px 56px;
  text-align: center;
  white-space: normal;
}
.orb-pair {
  position: relative;
  width: 480px; height: 200px; margin: 28px auto 36px;
}
.orb {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 140px; height: 140px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, rgba(220, 240, 255, 0.45), rgba(80, 140, 200, 0.25) 40%, rgba(20, 40, 70, 0.6) 80%);
  box-shadow:
    inset 0 0 30px rgba(180, 220, 255, 0.3),
    0 0 50px rgba(100, 180, 230, 0.3);
  border: 1px solid rgba(180, 220, 255, 0.4);
  transition: left 1500ms cubic-bezier(0.7, 0.0, 0.3, 1), right 1500ms cubic-bezier(0.7, 0.0, 0.3, 1);
}
.orb-l { left: 0; }
.orb-r { right: 0; }
.orb-pair.merged .orb-l { left: calc(50% - 100px); }
.orb-pair.merged .orb-r { right: calc(50% - 100px); }

.connect-line {
  position: absolute; left: 70px; right: 70px; top: 50%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  box-shadow: 0 0 8px var(--cyan);
  transform: translateY(-50%);
  opacity: 0;
  transition: opacity 800ms ease;
}
.orb-pair.merged .connect-line { opacity: 0.8; }

/* ───────────── Blank state ───────────── */
.blank-mark {
  position: absolute; left: 50%; top: 28px;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 14px;
  padding: 12px 22px;
  z-index: 20;
  white-space: nowrap;
}
.blank-pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ink-1);
  position: relative;
}
.blank-pulse::after {
  content: ""; position: absolute; inset: -2px;
  border: 1px solid var(--ink-2);
  border-radius: 50%;
  animation: pulse-ring 2.4s ease-out infinite;
}

.blank-shroud {
  position: absolute; left: 37%; top: 46%;
  transform: translate(-50%, -50%);
  width: 540px; height: 540px;
  border-radius: 50%;
  border: 1px solid rgba(180, 220, 255, 0.10);
  pointer-events: none;
  animation: fadeUp 1200ms ease both;
}
.blank-shroud::before {
  content: ""; position: absolute; inset: -40px;
  border-radius: 50%;
  border: 1px solid rgba(180, 220, 255, 0.05);
}
.blank-shroud::after {
  content: ""; position: absolute; inset: 24px;
  border-radius: 50%;
  border: 1px dashed rgba(180, 220, 255, 0.08);
}

.blank-tagline {
  position: absolute; left: 50%; bottom: 130px;
  transform: translateX(-50%);
  text-align: center;
  z-index: 20;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'), [],
  );
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

function ECG({ bpm = 72, warn = false }) {
  const ref = useRef(null);
  useEffect(() => {
    let raf, t = 0;
    const draw = () => {
      const el = ref.current;
      if (!el) return;
      const W = 220, H = 56;
      const beat = 60 / bpm;
      const points = [];
      for (let i = 0; i < W; i++) {
        const x = i;
        const tt = ((t + i) / 30) % beat;
        let y = H / 2;
        const phase = tt / beat;
        if (phase > 0.10 && phase < 0.14) y -= 4;
        else if (phase > 0.18 && phase < 0.20) y += 6;
        else if (phase > 0.20 && phase < 0.22) y -= 22;
        else if (phase > 0.22 && phase < 0.24) y += 8;
        else if (phase > 0.32 && phase < 0.40) y -= 5;
        y += Math.sin((t + i) * 0.4) * 0.6;
        points.push(`${x},${y.toFixed(1)}`);
      }
      el.setAttribute("points", points.join(" "));
      t += 1.2;
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(raf);
  }, [bpm]);
  return (
    <div className="ecg-track">
      <svg viewBox="0 0 220 56" preserveAspectRatio="none" width="100%" height="56">
        <polyline ref={ref} className="ecg-line" style={{ stroke: warn ? "var(--coral)" : "var(--cyan)" }} />
      </svg>
    </div>
  );
}

function Wave({ count = 36, warn = false }) {
  const bars = useMemo(() => Array.from({ length: count }, (_, i) => ({
    delay: (i * 73) % 1400,
    height: 0.3 + Math.abs(Math.sin(i * 1.7)) * 0.7,
  })), [count]);
  return (
    <div className="wave">
      {bars.map((b, i) => (
        <i key={i} style={{
          animationDelay: `-${b.delay}ms`,
          height: `${b.height * 100}%`,
          background: warn ? "var(--coral)" : "var(--cyan)",
          boxShadow: warn ? "0 0 6px var(--coral)" : "0 0 6px var(--cyan-deep)",
        }} />
      ))}
    </div>
  );
}

function HeartPanel({ exiting }) {

      </div>

      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10 }}>
        <span className="label">심박변이 42ms</span>
        <span className="label">산소포화도 98%</span>
      </div>
    </div>
  );
}

function VoicePanel({ exiting }) {
  return (
    <div className={`glass panel panel-pos ${exiting ? "fade-out" : ""}`}
      style={{ right: "5%", top: "22%", width: 268 }}>
      <i className="ticks"><i></i></i>
      <div className="panel-head">
        <span className="label">음성 스트레스</span>
        <span className="chip cyan">v3.4</span>
      </div>
      <Wave warn={false} />
      <div style={{ marginTop: 12, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <div>
          <div className="label" style={{ marginBottom: 4 }}>음정 변화</div>
          <div className="meter"><div className="meter-fill" style={{ width: "62%" }} /></div>
        </div>

<script type="text/babel">
function GestureController() {
  const [cursor, setCursor] = React.useState({ x: -300, y: -300, pinching: false });
  const stateRef = React.useRef({ pinching: false, cooldown: false, swipeCooldown: false });
  const smooth   = React.useRef({ x: -300, y: -300 });
  const posHist  = React.useRef([]);

  React.useEffect(() => {
    if (typeof Hands === 'undefined' || typeof Camera === 'undefined') return;

    const videoEl = document.createElement('video');
    videoEl.setAttribute('playsinline', '');

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.5,
    });

    hands.onResults((results) => {
      if (!results.multiHandLandmarks?.length) {
        setCursor(c => ({ ...c, x: -300, y: -300 }));
        return;
      }

      const lm = results.multiHandLandmarks[0];
      const idx   = lm[8]; // 검지 끝
      const thumb = lm[4]; // 엄지 끝

      // 카메라 미러링 반영
      const rawX = (1 - idx.x) * window.innerWidth;
      const rawY = idx.y * window.innerHeight;

      // 지수 이동 평균으로 떨림 완화 (0.12 = 더 부드럽게, 높이면 더 빠르게 반응)
      const A = 0.12;
      smooth.current.x += (rawX - smooth.current.x) * A;
      smooth.current.y += (rawY - smooth.current.y) * A;
      const { x, y } = smooth.current;

      const dist = Math.hypot(idx.x - thumb.x, idx.y - thumb.y);
      const isPinching = dist < 0.07;

      if (isPinching && !stateRef.current.pinching && !stateRef.current.cooldown) {
        stateRef.current.cooldown = true;
        const el = document.elementFromPoint(x, y);
        if (el) el.click();
        setTimeout(() => { stateRef.current.cooldown = false; }, 800);
      }

      stateRef.current.pinching = isPinching;
      setCursor({ x, y, pinching: isPinching });

      // 스와이프 감지: 최근 12프레임 내 200px 이상 우측 이동
      const hist = posHist.current;
      hist.push({ x, t: Date.now() });
      if (hist.length > 15) hist.shift();
      if (hist.length >= 8 && !stateRef.current.swipeCooldown) {
        const prev = hist[hist.length - 8];
        const dx = x - prev.x;
        const dt = Date.now() - prev.t;
        if (dx > 180 && dt < 450) {
          stateRef.current.swipeCooldown = true;
          window.dispatchEvent(new CustomEvent('gestureswipe', { detail: { dir: 'right' } }));
          setTimeout(() => { stateRef.current.swipeCooldown = false; }, 1200);
        }
      }
    });

    const camera = new Camera(videoEl, {
      onFrame: async () => { await hands.send({ image: videoEl }); },
      width: 640,
      height: 480,
    });

    camera.start().catch(console.error);
    return () => { try { camera.stop(); } catch(e) {} };
  }, []);

  const visible = cursor.x > 0;
  return (
    <div style={{
      position: 'fixed',
      left: cursor.x,
      top: cursor.y,
      width: cursor.pinching ? 18 : 30,
      height: cursor.pinching ? 18 : 30,
      borderRadius: '50%',
      background: cursor.pinching ? 'rgba(100,200,255,0.55)' : 'transparent',
      border: `1.5px solid rgba(180,220,255,${visible ? 0.8 : 0})`,
      transform: 'translate(-50%, -50%)',
      pointerEvents: 'none',
      zIndex: 9999,
      transition: 'width 80ms, height 80ms, background 80ms',
      boxShadow: cursor.pinching ? '0 0 20px rgba(100,200,255,0.5)' : 'none',
    }}>
      {!cursor.pinching && visible && (
        <div style={{
          position: 'absolute', top: '50%', left: '50%',
          width: 4, height: 4, borderRadius: '50%',
          background: 'rgba(180,220,255,0.8)',
          transform: 'translate(-50%, -50%)',
        }} />
      )}
    </div>
  );
}

window.GestureController = GestureController;
</script>

<script type="text/babel">
const { useState: useStateC, useEffect: useEffectC } = React;

function Ceremony({ phase, onAdvance, onCancel }) {
  const [merged, setMerged] = useStateC(false);
  useEffectC(() => {
    if (phase === "consent") {
      const t = setTimeout(() => setMerged(true), 200);
      return () => clearTimeout(t);
    } else if (phase !== "sealed") {
      setMerged(false);
    }
  }, [phase]);

  return (
    <div className="ceremony-bg">
      <div className="glass glass-strong ceremony-card">
        <i className="ticks"><i></i></i>

        <div className="eyebrow" style={{ color: "var(--cyan)" }}>블랭크 · 동의 프로토콜</div>
        <h1 style={{ fontSize: 30, fontWeight: 300, marginTop: 12, letterSpacing: "-0.02em" }}>
          {phase === "propose" && "분석을 비우시겠습니까?"}
          {phase === "awaiting" && "상대방의 응답을 기다리는 중"}
          {phase === "consent" && "서로의 동의를 봉인합니다"}
          {phase === "sealed" && "블랭크 합의가 완료되었습니다"}
        </h1>
        <p style={{
          fontSize: 14, color: "var(--ink-2)", marginTop: 14, lineHeight: 1.7,
          maxWidth: 480, marginLeft: "auto", marginRight: "auto",
        }}>
          {phase === "propose" && "이 세션 동안 거짓말 분석·심박·미세표정·음성 데이터를 양측에서 수집·저장하지 않습니다. 양쪽이 동의해야 시작됩니다."}
          {phase === "awaiting" && "김세연 님의 글래스에 제안이 전송되었습니다. 응답까지 평균 6초."}
          {phase === "consent" && "두 글래스 사이 신뢰 채널이 열렸습니다. 함께 봉인하면 모든 분석이 정지합니다."}
          {phase === "sealed" && "이 시간 동안의 통화는 분석되지 않습니다. 어느 쪽도 기록을 보유할 수 없습니다."}
        </p>

        <div className={`orb-pair ${phase === "consent" || phase === "sealed" ? "merged" : ""}`}>
          <div className="orb orb-l">
            <div style={{
              position: "absolute", left: "50%", bottom: -36, transform: "translateX(-50%)",
              textAlign: "center", whiteSpace: "nowrap",
            }}>
              <div className="label">나</div>
              <div className="mono" style={{ fontSize: 11, color: "var(--ink-1)", marginTop: 4 }}>이 정 우</div>
            </div>
          </div>
          <div className="connect-line" />
          <div className="orb orb-r">
            <div style={{
              position: "absolute", left: "50%", bottom: -36, transform: "translateX(-50%)",
              textAlign: "center", whiteSpace: "nowrap",
            }}>
              <div className="label">상대방</div>
              <div className="mono" style={{ fontSize: 11, color: "var(--ink-1)", marginTop: 4 }}>김 세 연</div>
            </div>
          </div>
          {phase === "awaiting" && (
            <div style={{
              position: "absolute", left: "50%", top: "50%",
              transform: "translate(-50%, -50%)",
            }} className="blink">
              <span className="label" style={{ color: "var(--cyan)" }}>· · ·</span>
            </div>
          )}
        </div>

        <div style={{
          display: "flex", justifyContent: "center", gap: 10, marginTop: 8,
          fontFamily: "var(--font-mono)", fontSize: 10, letterSpacing: "0.18em",
          color: "var(--ink-3)", textTransform: "uppercase",
          flexWrap: "nowrap", whiteSpace: "nowrap",
        }}>
          <span style={{ color: phase === "propose" ? "var(--cyan)" : "var(--ink-3)" }}>01 제안</span>
          <span>—</span>
          <span style={{ color: phase === "awaiting" ? "var(--cyan)" : "var(--ink-3)" }}>02 대기</span>
          <span>—</span>
          <span style={{ color: phase === "consent" ? "var(--cyan)" : "var(--ink-3)" }}>03 봉인</span>
          <span>—</span>
          <span style={{ color: phase === "sealed" ? "var(--mint)" : "var(--ink-3)" }}>04 블랭크</span>
        </div>

        <div style={{ display: "flex", gap: 12, justifyContent: "center", marginTop: 36 }}>
          {phase === "propose" && (
            <>
              <button className="btn btn-ghost" onClick={onCancel}>취소</button>
              <button className="btn btn-primary" onClick={onAdvance}>제안 보내기 →</button>
            </>
          )}
          {phase === "awaiting" && (
            <button className="btn btn-ghost" onClick={onCancel}>제안 취소</button>
          )}
          {phase === "consent" && (
            <>
              <button className="btn btn-ghost" onClick={onCancel}>거절</button>
              <button className="btn btn-primary" onClick={onAdvance}>함께 봉인 ▢</button>
            </>
          )}
          {phase === "sealed" && (
            <button className="btn btn-primary" onClick={onAdvance}>블랭크 모드 진입 →</button>
          )}
        </div>

        <div style={{
          marginTop: 32, paddingTop: 20, borderTop: "1px solid var(--hair)",
          display: "flex", justifyContent: "space-between", gap: 16,
          fontFamily: "var(--font-mono)", fontSize: 10, letterSpacing: "0.16em",
          color: "var(--ink-3)", textTransform: "uppercase",
          whiteSpace: "nowrap",
        }}>
          <span>세션-A21·09</span>
          <span>SHA-3 / 블랭크 / 상호동의</span>
          <span>규정 §14.2</span>
        </div>
      </div>
    </div>
  );
}

window.Ceremony = Ceremony;
</script>

<!-- app -->
<script type="text/babel">
const { useState: useAppState, useEffect: useAppEffect } = React;

const TWEAK_DEFAULTS = {
  "previewAnalysis": "on",
  "showSubject": true,
  "showReticle": true
};

function App() {
  const [phase, setPhase] = useAppState("analyzing");
  const [showCeremony, setShowCeremony] = useAppState(false);
  const [started, setStarted] = useAppState(false);
  const [sweeping, setSweeping] = useAppState(false);
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const videoRef = useRef(null);

  const isAnalyzing = (phase === "analyzing") && t.previewAnalysis !== "off";
  const isBlank = phase === "blank" || (phase === "analyzing" && t.previewAnalysis === "off");

  const handleStart = () => setStarted(true);

  useAppEffect(() => {
    if (started && videoRef.current) {
      videoRef.current.play().catch(() => {});
    }
  }, [started]);

  const sweep = (fn) => {
    setSweeping(false);
    requestAnimationFrame(() => {
      setSweeping(true);
      setTimeout(() => setSweeping(false), 450);
      fn();
    });
  };

  const start   = () => { setPhase("propose"); setShowCeremony(true); };
  const advance = () => {
    setPhase((p) => {
      if (p === "propose") return "awaiting";
      if (p === "awaiting") return "consent";
      if (p === "consent") return "sealed";
      if (p === "sealed") {
        setShowCeremony(false);
        return "blank";
      }
      return p;
    });
  };

  // 우측 스와이프 → 다음 상태로 전환
  useAppEffect(() => {
    const onSwipe = (e) => {
      if (e.detail.dir !== 'right') return;
      sweep(() => {
        if (phase === "analyzing") start();
        else if (phase === "blank") reset();
        else advance();
      });
    };
    window.addEventListener('gestureswipe', onSwipe);
    return () => window.removeEventListener('gestureswipe', onSwipe);
  }, [phase]);
  const cancel = () => { setShowCeremony(false); setPhase("analyzing"); };
  const reset = () => { setShowCeremony(false); setPhase("analyzing"); };

  useAppEffect(() => {
    if (phase === "awaiting") {
      const id = setTimeout(() => setPhase("consent"), 2200);
      return () => clearTimeout(id);
    }
  }, [phase]);

  if (!started) {
    return (
      <div style={{
        position: "fixed", inset: 0,
        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
        background: "#04060a",
        gap: 32,
      }}>
        <div style={{ textAlign: "center" }}>
          <div style={{
            fontFamily: "var(--font-mono, monospace)",
            fontSize: 11, letterSpacing: "0.28em", textTransform: "uppercase",
            color: "rgba(180,220,255,0.35)", marginBottom: 16,
          }}>BLANK · AR GLASSES · 2040</div>
          <div style={{
            fontSize: 32, fontWeight: 300, letterSpacing: "-0.02em",
            color: "rgba(180,220,255,0.75)",
          }}>시뮬레이션</div>
        </div>
        <button onClick={handleStart} style={{
          fontFamily: "var(--font-sans, sans-serif)",
          fontSize: 15, fontWeight: 500, letterSpacing: "0.02em",
          padding: "16px 40px",
          background: "linear-gradient(180deg, rgba(60,130,220,0.82), rgba(30,90,180,0.78))",
          color: "#fff",
          border: "1px solid rgba(120,180,255,0.35)",
          borderRadius: "100px",
          cursor: "pointer",
          backdropFilter: "blur(24px)",
          boxShadow: "inset 0 1px 0 rgba(255,255,255,0.25), 0 0 40px rgba(60,130,220,0.25)",
          display: "flex", alignItems: "center", gap: 12,
          transition: "all 200ms ease",
        }}
        onMouseEnter={e => e.currentTarget.style.background = "linear-gradient(180deg, rgba(70,145,235,0.90), rgba(40,105,200,0.86))"}
        onMouseLeave={e => e.currentTarget.style.background = "linear-gradient(180deg, rgba(60,130,220,0.82), rgba(30,90,180,0.78))"}
        >
          <span style={{
            width: 10, height: 10, borderRadius: "50%",
            background: "rgba(180,220,255,0.9)",
            boxShadow: "0 0 10px rgba(180,220,255,0.8)",
            display: "inline-block",
          }} />
          시뮬레이션 시작
        </button>
      </div>
    );
  }

  return (
    <>
      <div className="world" />
      <div className="world-photo">
        <video ref={videoRef} loop playsInline src="bg.mov" />
      </div>
      <div className="floor" />
      <div className="lens-frame" />

      {t.showSubject && <Subject blank={isBlank} />}
      {t.showReticle && !isBlank && <Reticle />}

      {!isBlank && <StatusBar />}
      {isBlank && <BlankBar />}

      {isAnalyzing && (
        <>
          <HeartPanel />
          <VoicePanel />
          <FacePanel />
          <TruthPanel />
          <Transcript />
        </>
      )}

      {isBlank && (
        <>
          <div className="blank-shroud" />
          <div className="blank-tagline">
            <div className="eyebrow" style={{ color: "var(--ink-2)" }}>아무것도 분석되지 않습니다</div>
            <div style={{
              fontSize: 22, fontWeight: 300, marginTop: 10,
              color: "var(--ink-1)", letterSpacing: "-0.01em",
            }}>
              이 대화는 둘 사이에만 머뭅니다.
            </div>
          </div>
        </>
      )}

      {!isBlank && phase === "analyzing" && (
        <div className="actions">
          <button className="btn btn-ghost">
            <span style={{ width: 14, height: 14, borderRadius: 3, border: "1px solid currentColor", display: "inline-block" }} />
            세션 기록 보기
          </button>
          <button className="btn btn-primary" onClick={start}>
            <span style={{
              width: 12, height: 12, borderRadius: "50%",
              background: "var(--cyan)", boxShadow: "0 0 10px var(--cyan)",
            }} />
            Blank 제안하기
          </button>
        </div>
      )}
      {isBlank && phase === "blank" && (
        <div className="actions">
          <button className="btn btn-ghost" onClick={reset}>분석 다시 켜기</button>
          <button className="btn">세션 종료 →</button>
        </div>
      )}

      {showCeremony && (
        <Ceremony phase={phase} onAdvance={advance} onCancel={cancel} />
      )}

      {sweeping && <div className="swipe-sweep" />}
      <GestureController />

      <TweaksPanel title="설정">
        <TweakSection label="분석 상태 미리보기">
          <TweakRadio
            label="분석"
            value={t.previewAnalysis}
            options={["on", "off"]}
            onChange={(v) => setTweak("previewAnalysis", v)}
          />
        </TweakSection>
        <TweakSection label="화면">
          <TweakToggle label="피사체" value={t.showSubject} onChange={(v) => setTweak("showSubject", v)} />
          <TweakToggle label="시선 조준점" value={t.showReticle} onChange={(v) => setTweak("showReticle", v)} />
        </TweakSection>
        <TweakSection label="흐름">
          <TweakButton label="블랭크 제안 시작 →" onClick={start} />
          <TweakButton label="처음으로 리셋" onClick={reset} secondary />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
